<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Osaka Dining Compass</title>

  <style>
    body {
      margin: 0;
      background: #f7f4ee;
      color: #2b2b2b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.7;
    }

    .header {
      background: linear-gradient(135deg, #b51f1f, #e34a27);
      color: white;
      padding: 70px 24px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 12px;
      font-size: 38px;
    }

    .header p {
      margin: 0;
      font-size: 18px;
      opacity: 0.95;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 50px 24px;
    }

    .card {
      display: block;
      margin-bottom: 20px;
      padding: 26px;
      background: white;
      border-radius: 16px;
      color: #2b2b2b;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card h2 {
      margin: 0 0 8px;
      color: #b51f1f;
    }

    .card p {
      margin: 0;
    }

    footer {
      padding: 30px 20px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header class="header">
    <h1>Osaka Dining Compass</h1>
    <p>Your guide to dining, sightseeing, and travel in Osaka.</p>
  </header>

  <main class="container">
    <a class="card" href="privacy.html">
      <h2>Privacy Policy</h2>
      <p>Learn how Osaka Dining Compass handles user information.</p>
    </a>

    <a class="card" href="support.html">
      <h2>Support</h2>
      <p>Get help, report an issue, or send feedback.</p>
    </a>
  </main>

  <footer>
    © 2026 Kentaro Iwata. All rights reserved.
  </footer>
</body>
</html>
